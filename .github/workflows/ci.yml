name: CI

on:
  # Releases are not started by tags: CI creates the tag when pluginVersion changes (see the version job).
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  # Runs first and decides whether this run releases (outputs.release): the main branch has a
  # pluginVersion that has no tag yet, so CI tags this commit and releases it.
  version:
    name: version
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.decide.outputs.release }}
      version: ${{ steps.decide.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Decide whether to release
        id: decide
        run: |
          version=$(sed -n 's/^pluginVersion=//p' gradle.properties)
          release=false
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = "refs/heads/${{ github.event.repository.default_branch }}" ] && \
             ! git ls-remote --exit-code --tags origin "refs/tags/$version" >/dev/null; then
            release=true
            echo "::notice::$version has no release yet: releasing it"
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Release: $release ($version)"

  build:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4

      - name: No comments in the sources
        run: java checks/Comments.java check src

      - name: Test and build the plugin
        run: ./gradlew test buildPlugin

      - name: Check compatibility with IntelliJ IDEA releases
        run: ./gradlew verifyPlugin

      - uses: actions/upload-artifact@v4
        with:
          name: jpm-intellij
          path: build/distributions/*.zip

  release:
    name: release
    if: needs.version.outputs.release == 'true'
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: jpm-intellij
          path: release

      - name: Assemble release files
        run: |
          set -eux
          v="$VERSION"
          zip="jpm-intellij-$v.zip"
          test -f "release/$zip"
          since=$(unzip -p "release/$zip" "jpm-intellij/lib/jpm-intellij-$v.jar" > plugin.jar && unzip -p plugin.jar META-INF/plugin.xml \
            | sed -n 's/.*since-build="\([^"]*\)".*/\1/p' | head -n 1)
          test -n "$since"
          # A custom plugin repository: IntelliJ installs and updates the plugin from
          # https://github.com/<repo>/releases/latest/download/updatePlugins.xml
          cat > release/updatePlugins.xml <<XML
          <?xml version="1.0" encoding="UTF-8"?>
          <plugins>
            <plugin id="dev.jpm" version="$v" url="https://github.com/$GITHUB_REPOSITORY/releases/download/$v/$zip">
              <idea-version since-build="$since"/>
              <name>jpm</name>
              <vendor url="https://github.com/java-package-manager/jpm">jpm</vendor>
              <description>Support for jpm, the Java package manager and build tool.</description>
            </plugin>
          </plugins>
          XML
          printf '%s\n' "$v" > release/VERSION
          cd release && sha256sum * > SHA256SUMS && cat SHA256SUMS && cat updatePlugins.xml

      - name: Publish on GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "::notice::$VERSION is already released"
            exit 0
          fi
          # creates the tag on this commit when the release was started by a version change
          # 1.0.0-rc1 and the like are prereleases: they never become releases/latest
          pre=""; case "$VERSION" in *-*) pre="--prerelease" ;; esac
          gh release create "$VERSION" release/* $pre --target "$GITHUB_SHA" --title "jpm for IntelliJ IDEA $VERSION" --generate-notes

  marketplace:
    name: JetBrains Marketplace
    if: needs.version.outputs.release == 'true'
    needs: [version, release]
    runs-on: ubuntu-latest
    env:
      JETBRAINS_MARKETPLACE_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
      PLUGIN_SIGNING_CERTIFICATE_CHAIN: ${{ secrets.PLUGIN_SIGNING_CERTIFICATE_CHAIN }}
      PLUGIN_SIGNING_PRIVATE_KEY: ${{ secrets.PLUGIN_SIGNING_PRIVATE_KEY }}
      PLUGIN_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.PLUGIN_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        if: env.JETBRAINS_MARKETPLACE_TOKEN != ''
      - uses: actions/setup-java@v4
        if: env.JETBRAINS_MARKETPLACE_TOKEN != ''
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        if: env.JETBRAINS_MARKETPLACE_TOKEN != ''
      - name: Publish to the JetBrains Marketplace
        if: env.JETBRAINS_MARKETPLACE_TOKEN != ''
        # signPlugin runs only when the signing secrets are set; the Marketplace signs unsigned uploads itself.
        run: ./gradlew publishPlugin
      - name: Skipped
        if: env.JETBRAINS_MARKETPLACE_TOKEN == ''
        run: echo "No JETBRAINS_MARKETPLACE_TOKEN secret; the release is on GitHub only."
